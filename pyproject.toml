[project]
name = "csdid"
version = "0.2.9"
description = "Difference in Difference in Python"
authors = [
    {name = "D2CML Team"},
    {name = "Alexander Quispe"},
    {name = "Carlos Guevara"},
    {name = "Jhon Flores"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9,<4.0"
keywords = ["Causal inference", "Research"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "patsy",
    "plotnine",
    "joblib",
    "docutils",
]

[project.urls]
Homepage = "https://github.com/d2cml-ai/csdid"
Repository = "https://github.com/d2cml-ai/csdid"

[tool.poetry]
packages = [{include = "csdid"}]
include = [
    {path = "data", format = ["sdist"]},
    {path = "configs", format = ["sdist"]},
]

[tool.poetry.group.dev.dependencies]
pytest = "*"
ipykernel = "*"
statsmodels = "*"
twine = "*"
DRDID = {git = "https://github.com/d2cml-ai/DRDID"}
ruff = "^0.15.12"
mypy = ">=1.0,<1.15"
pytest-cov = "^7.1.0"

[tool.ruff]
line-length = 100
exclude = ["archive", "**/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["test"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
